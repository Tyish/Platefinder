services:
  db:
    image: postgres:16-alpine
    container_name: numberplates-db
    environment:
      POSTGRES_USER: numberplates
      POSTGRES_PASSWORD: numberplates
      POSTGRES_DB: numberplates
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numberplates -d numberplates"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
